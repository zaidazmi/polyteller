<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polyteller</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Polyteller</h1>
    </header>
    <main>
      <div id="event-info" class="card">
        <h2 id="event-title"></h2>
        <div id="countdown" class="countdown"></div>
        <div id="local-end-time" class="end-time"></div>
      </div>
      <div id="notify-section" class="notification-section card">
        <label for="notification-time">Notify me</label>
        <div class="select-wrapper">
          <select id="notification-time">
            <option value="5">5 minutes before</option>
            <option value="15">15 minutes before</option>
            <option value="30">30 minutes before</option>
            <option value="60">1 hour before</option>
            <option value="custom">Custom time before</option>
          </select>
        </div>
        <div id="custom-time-inputs" style="display: none;">
          <div class="custom-time-inputs-wrapper">
            <input type="number" id="custom-days" placeholder="Days" min="0">
            <input type="number" id="custom-hours" placeholder="Hours" min="0" max="23">
            <input type="number" id="custom-minutes" placeholder="Mins" min="0" max="59">
            <input type="number" id="custom-seconds" placeholder="Secs" min="0" max="59">
          </div>
          <div id="custom-time-error" class="error-message" style="display: none;"></div>
        </div>
        <button id="set-notification">Set Notification</button>
      </div>
      <div id="set-notifications" class="set-notifications card">
        <div class="notifications-header">
          <h3>Set Notifications</h3>
          <button id="view-all-notifications" class="view-all-btn">View all</button>
        </div>
        <ul id="notifications-list"></ul>
      </div>
      <div id="trade-confirmation-setting" class="card">
        <div class="trade-confirmation-content">
          <span>Enable trade confirmation popup</span>
          <label class="switch">
            <input type="checkbox" id="trade-confirmation-toggle">
            <span class="slider round"></span>
          </label>
        </div>
      </div>
      <div id="privacy-mode-setting" class="card">
        <div class="privacy-mode-content">
          <span>Enable privacy mode</span>
          <label class="switch">
            <input type="checkbox" id="privacy-mode-toggle">
            <span class="slider round"></span>
          </label>
        </div>
      </div>
    </main>
    <footer>
      <div id="notification-status" class="status-message"></div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
